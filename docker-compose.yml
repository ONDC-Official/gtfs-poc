# ---------------------------------------------------------------------------
# Delhi Bus Network - four tiers, four services.
#
#   loader      data plane   one-shot: GTFS static .txt -> SQLite, then exits
#   api         service tier FastAPI + the 30s realtime poller
#   web         UI tier      nginx serving the React bundle and fronting the API
#   prometheus  observability  scrapes the quality metrics at api:8000/api/metrics
#
# Start:  docker compose up -d --build      then open http://localhost:8080
#
# Storage backend:
#   Default is SQLite (DB_BACKEND unset). To run on PostgreSQL + PostGIS:
#     DB_BACKEND=postgres docker compose --profile postgres up -d --build
#   That starts the `db` service and points the api at it. `db` is behind a
#   compose profile, so a plain `up` never touches it and the SQLite path is
#   byte-for-byte unchanged.
#
# Perf harness (harness/, compose profile "harness"):
#   Mock BMTC + test runner for the Transit Hub perf tests against dev. Never
#   started by a plain `up`:
#     docker compose --profile harness up -d --build harness-mock
#     docker compose --profile harness run --rm harness run /scenarios/dev/<scenario>.yaml
#   See harness/README.md.
#
# Metrics/Grafana:
#   prometheus is always started (metrics work on either storage backend) and
#   binds to PROMETHEUS_PORT (default 127.0.0.1:9090) so an existing Grafana
#   instance elsewhere on the host can add it as a datasource - this repo does
#   not ship its own Grafana container. Import grafana/dashboard.json there.
# ---------------------------------------------------------------------------

name: delhi-gtfs

services:
  # PostgreSQL + PostGIS. Only started under `--profile postgres`; the api
  # service waits for it (required:false) only when it is part of the run.
  db:
    image: postgis/postgis:16-3.4
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: gtfs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gtfs}
      POSTGRES_DB: gtfs
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-127.0.0.1:5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtfs -d gtfs"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Builds the database before the API is allowed to start. Idempotent, so it
  # is cheap on every boot after the first; set GTFS_FORCE_RELOAD=1 to rebuild.
  loader:
    build:
      context: ./backend
    image: delhi-gtfs-api:latest
    command: ["load"]
    environment:
      DB_PATH: /data/gtfs.db
      GTFS_STATIC_DIR: /gtfs
      GTFS_FORCE_RELOAD: ${GTFS_FORCE_RELOAD:-0}
    volumes:
      - gtfs-data:/data
      - ${GTFS_STATIC_DIR:-./delhi_buses_static_gtfs_v1-2}:/gtfs:ro
    restart: "no"

  api:
    build:
      context: ./backend
    image: delhi-gtfs-api:latest
    depends_on:
      loader:
        condition: service_completed_successfully
      # Waited on only when the `postgres` profile brings `db` into the run;
      # a plain `up` omits db entirely and this is ignored.
      db:
        condition: service_healthy
        required: false
    # App configuration, later file wins. Secrets live here, never in the
    # image. Do NOT restate these keys under `environment:` - an unset
    # ${VAR:-} there resolves to an empty string and silently overrides the
    # file, which is how you end up running the mock feed by accident.
    #
    # Plain list, not the `path:/required:` form: the deployment host runs
    # Compose 2.21, which doesn't support it (this matches what the server
    # has been running). The repo-root .env must exist; put the feed
    # settings there.
    env_file:
      - .env
    environment:
      # Container paths only. `environment` outranks `env_file`, which is what
      # makes these win over any host-oriented value in a .env.
      DB_PATH: /data/gtfs.db
      GTFS_STATIC_DIR: /gtfs
      # SQLite unless explicitly switched. With DB_BACKEND unset this whole
      # block is inert and the container behaves exactly as before.
      DB_BACKEND: ${DB_BACKEND:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-postgresql://gtfs:gtfs@db:5432/gtfs}
    volumes:
      - gtfs-data:/data
      - ${GTFS_STATIC_DIR:-./delhi_buses_static_gtfs_v1-2}:/gtfs:ro
    expose:
      - "8000"
    # Published only when you need to reach the API directly; the UI does not
    # require it, since nginx proxies /api and /ws.
    ports:
      - "${API_PORT:-127.0.0.1:8000}:8000"
    restart: unless-stopped
    stop_grace_period: 20s
    # Docker's default json-file driver is unbounded; this poller runs
    # continuously, so cap it. (Anchor defined on the db service above.)
    logging: *logging

  # BMTC collectors: poll BMTC's APIs into the `bmtc` schema of the same
  # Postgres, keeping 72h. Behind the `bmtc` profile so a plain `up` never
  # starts them:
  #   docker compose --profile postgres --profile bmtc up -d --no-deps bmtc-collector bmtc-trip-collector
  # Needs BMTC_AUTH_TOKEN in the repo-root .env (or the shell) and the
  # Postgres `db` service; SQLite is unsupported.
  #
  # Same Dockerfile as `api`, but their own image tag, so building them never
  # changes the image DTC's api/loader start from.
  #
  # Settings come through `environment:` interpolation, not `env_file:` -
  # the `path:/required:` env_file form needs Compose >= 2.24, and the
  # deployment host runs 2.21. Every value has a default, so none can resolve
  # to an empty string except the token; the collectors exit at start, with
  # "BMTC_AUTH_TOKEN is not set" in their log, when that is missing.

  # Vehicle positions every 10s, static files every 72h.
  bmtc-collector:
    build:
      context: ./backend
    image: bmtc-collector:latest
    profiles: ["bmtc"]
    command: ["collect-bmtc"]
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment: &bmtc-env
      BMTC_AUTH_TOKEN: ${BMTC_AUTH_TOKEN:-}
      BMTC_POLL_SECONDS: ${BMTC_POLL_SECONDS:-10}
      BMTC_STATIC_EVERY_HOURS: ${BMTC_STATIC_EVERY_HOURS:-72}
      BMTC_RETENTION_HOURS: ${BMTC_RETENTION_HOURS:-72}
      BMTC_TRIP_POLL_MINUTES: ${BMTC_TRIP_POLL_MINUTES:-15}
      BMTC_STOP_TIMES_EVERY_HOURS: ${BMTC_STOP_TIMES_EVERY_HOURS:-72}
      BMTC_MIN_FREE_GB: ${BMTC_MIN_FREE_GB:-8}
      DATABASE_URL: ${DATABASE_URL:-postgresql://gtfs:gtfs@db:5432/gtfs}
      PG_POOL_MAX: "3"
    # No HTTP server here; the image's API healthcheck would always fail.
    healthcheck:
      disable: true
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging

  # Trip updates every 15 min and stop_times every 72h, zone by zone. A round
  # is ~256 MB over ~5 min, so it has its own process (never delays the 10s
  # vehicle polls) and hard caps, so a bad round cannot starve the host.
  bmtc-trip-collector:
    image: bmtc-collector:latest
    profiles: ["bmtc"]
    command: ["collect-bmtc-trips"]
    depends_on:
      db:
        condition: service_healthy
        required: false
    environment:
      <<: *bmtc-env
      PG_POOL_MAX: "2"
    cpus: 0.5
    mem_limit: 1536m
    healthcheck:
      disable: true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging

  # ---- Perf harness (profile "harness") -----------------------------------
  # Mock BMTC that the dev Transit Hub collector polls for MOCK_ agencies.
  # Plain HTTP on the compose network; web's nginx publishes only the feed,
  # under /mock-agency/ (TLS ends at the host nginx). The control API is on
  # host loopback only and is never routed through nginx.
  harness-mock:
    build:
      context: ./harness
    image: gtfs-harness:latest
    profiles: ["harness"]
    entrypoint: ["/mockbmtc"]
    command:
      - -addr=:9080
      - -control-addr=:9091
      - -token=${HARNESS_MOCK_TOKEN:-change-me}
      - -vehicles=${HARNESS_MOCK_VEHICLES:-7000}
    expose:
      - "9080"
      - "9091"
    ports:
      - "${HARNESS_CONTROL_PORT:-127.0.0.1:19191}:9091"
    healthcheck:
      test: ["CMD", "/mockbmtc", "-healthcheck", "http://127.0.0.1:9091/_harness/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Shared host: keep the mock from starving its neighbours.
    cpus: ${HARNESS_MOCK_CPUS:-0.5}
    mem_limit: ${HARNESS_MOCK_MEM:-768m}
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *logging

  # Test runner. One-shot, never started by `up`:
  #   docker compose --profile harness run --rm harness status
  #   docker compose --profile harness run --rm harness run /scenarios/dev/<scenario>.yaml
  # Settings via environment interpolation (Compose 2.21); every value has a
  # default except the admin key.
  harness:
    image: gtfs-harness:latest
    profiles: ["harness"]
    entrypoint: ["/harness"]
    command: ["help"]
    depends_on:
      harness-mock:
        condition: service_healthy
    environment:
      HARNESS_TARGET: dev
      HARNESS_CONSUMER_URL: ${HARNESS_CONSUMER_URL:-https://gtfs-dev.ondc.tech}
      HARNESS_MOCK_PUBLIC_URL: ${HARNESS_MOCK_PUBLIC_URL:-https://fis-staging.ondc.org/gtfs/mock-agency}
      HARNESS_MOCK_CONTROL_URL: http://harness-mock:9091
      HARNESS_ADMIN_API_KEY: ${HARNESS_ADMIN_API_KEY:-}
      HARNESS_MAX_MBIT: ${HARNESS_MAX_MBIT:-50}
      HARNESS_FAULTS_ALLOWED: ${HARNESS_FAULTS_ALLOWED:-false}
    volumes:
      - harness-state:/state
      - harness-reports:/reports
      - ./harness/scenarios:/scenarios:ro
    cpus: ${HARNESS_CPUS:-1.0}
    mem_limit: ${HARNESS_MEM:-1g}
    healthcheck:
      disable: true
    restart: "no"
    logging: *logging

  web:
    build:
      context: ./frontend
    image: delhi-gtfs-web:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped
    logging: *logging

  # Scrapes /api/metrics on the api container directly over this compose
  # network - never through nginx, same as the container healthcheck (see
  # prometheus/prometheus.yml's metrics_path). Not behind a profile: it works
  # against either storage backend, since the metrics it scrapes come from
  # QualityService, not from the database directly.
  prometheus:
    image: prom/prometheus:latest
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-127.0.0.1:9090}:9090"
    restart: unless-stopped
    logging: *logging

volumes:
  # The SQLite database. Realtime history lives here and grows with retention,
  # so keep it on a volume rather than in the container's writable layer.
  gtfs-data:
  # PostgreSQL data directory, used only under the `postgres` profile.
  pg-data:
  # Prometheus's own TSDB, so scrape history survives a container restart.
  prometheus-data:
  # Perf harness: mock agencies and their tokens, and run reports.
  harness-state:
  harness-reports:
