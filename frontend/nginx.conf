# Upstream is the compose service name; Docker's embedded DNS resolves it.
upstream api {
    server api:8000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A GTFS-RT frame for ~6k vehicles compresses to a fraction of its size,
    # and the JS bundle is ~1.5 MB uncompressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Container-level liveness, answered without touching the API.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed asset filenames, so they can be cached hard. The built index.html
    # references them under the app's base path (/gtfs/assets/..., set by
    # vite.config.ts's `base`), which is a different URL from where the files
    # actually sit on disk (dist/assets/, no /gtfs/ prefix) - `alias` maps the
    # one to the other; without it these requests fall through to the SPA
    # catch-all below and get served index.html with an HTML content-type,
    # which browsers refuse to load as a JS module.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /gtfs/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # The first poll after a cold start can be slow; do not cut it off.
        proxy_read_timeout 60s;
    }

    location /ws/ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        # The stream is idle between polls and sends a keepalive ping every
        # poll_seconds + 15; this must comfortably exceed that.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # api.ts/useLiveVehicles.ts build every request URL as `BASE_URL + path`,
    # and BASE_URL is /gtfs/ in production (vite.config.ts's `base`) - so the
    # browser actually calls /gtfs/api/... and /gtfs/ws/..., not /api/... and
    # /ws/... directly. Without these, both fall through to the SPA catch-all
    # below (same failure mode /gtfs/assets/ had) and every API/WS call
    # silently gets index.html back instead of a real response.
    location /gtfs/api/ {
        rewrite ^/gtfs/(.*)$ /$1 break;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    location /gtfs/ws/ {
        rewrite ^/gtfs/(.*)$ /$1 break;
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # SPA: unknown paths fall through to the app shell, never a 404 page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
