# Local system under test plus harness services. Started by `harness up`,
# which writes .harness/stack.env (sources, admin key, scenario parameters)
# and the TLS files in .harness/tls. Never connects to dev, production or the
# real BMTC: the collector's only feed is the mock below.
name: transit-hub-perf

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: transit
      POSTGRES_DB: postgres
    ports: ["${PG_PORT:-56432}:5432"] # harness only: read-only queries
    volumes:
      - ${COLLECTOR_SRC}/deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U transit -d read_db -tAc 'select 1' && psql -h 127.0.0.1 -U transit -d write_db -tAc 'select 1'"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Every service reaches Postgres through Toxiproxy, so scenarios can add
  # latency or cut the connection (proxy "postgres", listen :15432).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host", "0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes: ["./toxiproxy.json:/config/toxiproxy.json:ro"]
    ports: ["${TOXIPROXY_API_PORT:-18474}:8474"]
    depends_on:
      postgres: { condition: service_healthy }

  mockbmtc:
    build: { context: .., dockerfile: Dockerfile }
    command: # ENTRYPOINT is /mockbmtc
      - -addr=:9443
      - -control-addr=:9091
      - -tls-cert=/tls/server.pem
      - -tls-key=/tls/server-key.pem
      - -token=${MOCK_TOKEN}
      - -seed=${SEED:-1}
      - -vehicles=${MOCK_VEHICLES:-7000}
      - -trips-per-zone=${MOCK_TRIPS_PER_ZONE:-1500}
      - -stops-per-trip=${MOCK_STOPS_PER_TRIP:-40}
      - -static-stops=${MOCK_STATIC_STOPS:-2000}
      - -static-routes=${MOCK_STATIC_ROUTES:-300}
      - -static-trips-per-route=${MOCK_STATIC_TRIPS_PER_ROUTE:-10}
      - -static-stops-per-trip=${MOCK_STATIC_STOPS_PER_TRIP:-20}
    volumes: ["${HARNESS_DIR}/tls:/tls:ro"]
    ports: ["${MOCK_CONTROL_PORT:-19091}:9091"] # control API: harness only; the feed port is not published
    healthcheck:
      test: ["CMD", "/mockbmtc", "-healthcheck=http://127.0.0.1:9091/_harness/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  collector:
    build:
      context: ${COLLECTOR_SRC}
      args: { VERSION: perf-local }
    environment:
      HTTP_ADDR: ":8080"
      WRITE_DB_URL: postgres://transit:transit@toxiproxy:15432/write_db?sslmode=disable
      READ_DB_URL: postgres://transit:transit@toxiproxy:15432/read_db?sslmode=disable
      MIGRATE_ON_START: "true"
      SEED_ON_START: "true"
      AGENCY_ID: BMTC
      AGENCY_NAME: Bangalore Metropolitan Transport Corporation
      AGENCY_STATUS: active
      # The isolation check in `harness run` refuses to start unless this
      # points at the mock.
      AGENCY_FEED_BASE_URL: https://mockbmtc:9443
      AGENCY_BMTC_TOKEN: ${MOCK_TOKEN}
      AGENCY_POLL_INTERVAL_S: ${COLLECTOR_POLL_INTERVAL_S:-30}
      AGENCY_RETENTION_S: ${COLLECTOR_RETENTION_S:-300}
      AGENCY_REFRESH: 10s
      PROJECTOR_INTERVAL: ${PROJECTOR_INTERVAL:-5s}
      TRIP_UPDATES_ENABLED: ${TRIP_UPDATES_ENABLED:-false}
      SSL_CERT_FILE: /tls/ca.pem # trust the harness CA, nothing else
      LOG_LEVEL: info
    volumes: ["${HARNESS_DIR}/tls:/tls:ro"]
    ports: ["${COLLECTOR_PORT:-18080}:8080"]
    depends_on:
      toxiproxy: { condition: service_started }
      mockbmtc: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "${COLLECTOR_CPUS:-1.0}", memory: "${COLLECTOR_MEMORY:-1536M}" }

  consumer:
    build:
      context: ${CONSUMER_SRC}
      args: { VERSION: perf-local }
    environment:
      HTTP_ADDR: ":8082"
      READ_DB_URL: postgres://transit:transit@toxiproxy:15432/read_db?sslmode=disable
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      LOG_LEVEL: warn
    ports: ["${CONSUMER_PORT:-18082}:8082"]
    depends_on:
      collector: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "${CONSUMER_CPUS:-1.0}", memory: "${CONSUMER_MEMORY:-512M}" }

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=3d", "--web.enable-lifecycle"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${COLLECTOR_SRC}/deploy/prometheus/alerts.yml:/etc/prometheus/rules/collector.yml:ro
      - ${CONSUMER_SRC}/deploy/prometheus/alerts.yml:/etc/prometheus/rules/consumer.yml:ro
    ports: ["${PROMETHEUS_PORT:-19090}:9090"]

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin # local only
    volumes:
      - ${COLLECTOR_SRC}/deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${COLLECTOR_SRC}/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-13000}:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
