# TC-1 full: payload baseline for 30 minutes (document TC-1). One MOCK_
# agency serves a BMTC-sized feed (7,000 vehicles, ~1.5 MB, BMTC's +5:30
# timestamps, duplicates, stale and id-less vehicles mixed in) every 10 s;
# buyers read it back and every response is checked (valid protobuf, every
# vehicle has an id, none twice, timestamps corrected, data fresh).
# Not covered: trip zones (trip updates are off on dev; needs C2), S3 (not
# part of the system).
scenario_id: dev-tc-01-full
description: >
  TC-1 full: 7,000-vehicle feed every 10 s for 30 minutes, read back and checked.
seed: 11
agency_count: 1
upstream:
  vehicle_entities: 7000
collector:
  collector_interval_s: 10
  retention_s: 120
identities:
  valid: 3                # 64 requests/min each
ready_timeout: 6m
phases:
  - name: baseline-30min
    duration: 30m
    profiles:
      - { name: rt, endpoint: realtime, rps: 3, concurrency: 3, identities: [valid] }
      - { name: static, endpoint: static, rps: 0.2, concurrency: 1, identities: [valid] }
acceptance_thresholds:
  availability_min: 0.99
  realtime_p95_ms_max: 1000
  check_failures_max: 0
  client_saturated_max: 0
  data_age_s_max: 40
