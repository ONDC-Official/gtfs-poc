# TC-2 short: three MOCK_ agencies collected at once (the first steps of
# the 1 -> 25 ramp), each with its own token and feed. Buyers have grants
# to all three; load runs against MOCK_01. The mock's per-agency stats show
# all three collected.
scenario_id: dev-tc-02-ramp-short
description: >
  TC-2 short: 3 mock agencies collected in parallel, 10 s cadence.
seed: 2
agency_count: 3
upstream:
  vehicle_entities: 7000
collector:
  collector_interval_s: 10
  retention_s: 120
identities:
  valid: 3
ready_timeout: 6m
phases:
  - name: three-agencies
    duration: 2m
    profiles:
      - { name: rt, endpoint: realtime, rps: 3, concurrency: 3, identities: [valid] }
acceptance_thresholds:
  availability_min: 0.99
  check_failures_max: 0
  client_saturated_max: 0
  data_age_s_max: 40
