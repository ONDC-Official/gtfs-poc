# TC-6 smoke against a deployed Transit Hub (harness run --target dev).
# About 4 minutes of load plus setup: proves the dev path end to end (mock
# agency created through the agency API, collected by the deployed
# collector through the public mock URL, served to test buyers) before a
# long run. Low rates, so it is safe on a shared environment and a shared
# harness host. Not a performance result.
scenario_id: dev-tc-06-smoke
description: >
  TC-6 smoke against dev: one MOCK_ agency, every TC-6 check at low rate.
seed: 6
agency_count: 1

upstream:
  vehicle_entities: 7000
collector:
  # Written to the mock agency's poll interval and retention on the target.
  collector_interval_s: 10
  retention_s: 120

identities:
  valid: 5
  low_quota: 1
  low_quota_per_min: 10
  malformed: 1
  unknown_agency: 1

# Covers the collector's agency reload (30 s), the first static activation
# and the projector copying the new buyers.
ready_timeout: 6m

phases:
  - name: realtime
    duration: 90s
    profiles:
      - { name: rt, endpoint: realtime, rps: 5, concurrency: 5, identities: [valid] }
      - { name: rt-conditional, endpoint: realtime, rps: 2, concurrency: 2, conditional: true, identities: [valid] }
      - { name: rt-access-failures, endpoint: realtime, rps: 1, concurrency: 4, identities: [low_quota, malformed, unknown_agency] }
  - name: static
    duration: 60s
    profiles:
      - { name: static, endpoint: static, rps: 0.5, concurrency: 2, identities: [valid] }
      - { name: static-conditional, endpoint: static, rps: 0.5, concurrency: 1, conditional: true, identities: [valid] }
  - name: mixed-80-20
    duration: 60s
    profiles:
      - { name: rt, endpoint: realtime, rps: 4, concurrency: 4, identities: [valid] }
      - { name: static, endpoint: static, rps: 0.5, concurrency: 2, identities: [valid] }

# Only thresholds the harness can measure from outside (projector lag,
# collection success and alerts need server-side metrics; see plan G4).
acceptance_thresholds:
  availability_min: 0.99
  realtime_p95_ms_max: 1000   # internet path
  realtime_p99_ms_max: 2000
  check_failures_max: 0
  client_saturated_max: 0
  data_age_s_max: 60
