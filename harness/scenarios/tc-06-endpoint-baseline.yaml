# TC-6: Consumer endpoint baseline (test plan §6).
# Warm both paths, then real-time at target RPS for 30 minutes, static at
# 1–10 RPS, and an 80/20 mix. Checks zip/protobuf correctness, ETag and
# version headers, 403/404/429 behaviour and quota enforcement.
# Not yet part of the system, so not tested: OpenSearch independence.
scenario_id: tc-06-endpoint-baseline
description: >
  TC-6 endpoint baseline: real-time at target RPS for 30 min, static at
  1–10 RPS, then an 80/20 real-time/static mix, with access-failure buyers
  mixed in. RPS values are the test plan's illustrative targets; replace them
  with the agreed ones.
seed: 6
agency_count: 1

upstream:
  vehicle_entities: 7000 # about 2.4 MB per vehicle response, like BMTC
collector:
  collector_interval_s: 10
  projector_interval: 5s
  trip_updates_enabled: false

identities:
  valid: 50
  low_quota: 2
  low_quota_per_min: 30
  malformed: 2
  unknown_agency: 2

ready_timeout: 5m

phases:
  - name: warmup
    duration: 2m
    profiles:
      - { name: rt, endpoint: realtime, rps: 10, concurrency: 10, identities: [valid] }
      - { name: static, endpoint: static, rps: 1, concurrency: 2, identities: [valid] }
  - name: realtime-target
    duration: 30m
    profiles:
      - { name: rt, endpoint: realtime, rps: 50, concurrency: 50, identities: [valid] }
      - { name: rt-conditional, endpoint: realtime, rps: 10, concurrency: 10, conditional: true, identities: [valid] }
      - { name: rt-access-failures, endpoint: realtime, rps: 2, concurrency: 4, identities: [low_quota, malformed, unknown_agency] }
  - name: static-1rps
    duration: 5m
    profiles:
      - { name: static, endpoint: static, rps: 1, concurrency: 4, identities: [valid] }
  - name: static-10rps
    duration: 5m
    profiles:
      - { name: static, endpoint: static, rps: 10, concurrency: 20, identities: [valid] }
      - { name: static-conditional, endpoint: static, rps: 5, concurrency: 5, conditional: true, identities: [valid] }
  - name: mixed-80-20
    duration: 10m
    profiles:
      - { name: rt, endpoint: realtime, rps: 40, concurrency: 40, identities: [valid] }
      - { name: static, endpoint: static, rps: 10, concurrency: 20, identities: [valid] }

acceptance_thresholds:
  availability_min: 0.99
  realtime_p95_ms_max: 500
  realtime_p99_ms_max: 1000
  static_p95_ms_max: 2000
  server_error_rate_max: 0.01
  check_failures_max: 0
  client_saturated_max: 0
  projector_lag_s_max: 30
  data_age_s_max: 60 # collector interval + margin
  vehicle_collection_success_min: 0.999
