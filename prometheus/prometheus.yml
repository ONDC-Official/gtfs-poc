# Scrapes the GTFS quality metrics exposed at /metrics on the api container.
# 30s to match the realtime poller's own cadence (rt_poll_seconds) - no point
# scraping faster than the numbers underneath can actually change.
scrape_configs:
  - job_name: gtfs-quality
    scrape_interval: 30s
    static_configs:
      - targets: ["api:8000"]
